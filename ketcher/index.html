<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#000000"/><meta name="description" content="Ketcher is a web-based chemical structure editor"/><link rel="shortcut icon" type="image/x-icon" href="./favicon.ico"/><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png"/><link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png"/><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"/><link rel="manifest" href="./manifest.json"/><title>Ketcher v3.17.0</title><script defer="defer" src="./static/js/main.cb80d824.js"></script><link href="./static/css/main.9cca8bc6.css" rel="stylesheet">
                <script id="obsidian-chemdraw-bridge">
                    window.addEventListener('message', function(event) {
                        if (!event.data) return;
                        
                        // Receive SMILES from Obsidian
                        if (event.data.type === 'setSmiles') {
                            var check = setInterval(function() {
                                if (window.ketcher) {
                                    window.ketcher.setMolecule(event.data.smiles);
                                    clearInterval(check);
                                }
                            }, 200);
                        } 
                        // Send SMILES back to Obsidian
                        else if (event.data.type === 'getSmiles') {
                            if (window.ketcher) {
                                window.ketcher.getSmiles().then(function(smiles) {
                                    window.parent.postMessage({ type: 'saveSmiles', smiles: smiles }, '*');
                                });
                            }
                        }
                    });
                </script>
                </head><body><noscript>You need to enable JavaScript to run this app.</noscript><div id="root"></div></body></html>
